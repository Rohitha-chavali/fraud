# Render Blueprint Specification for Fraud Shield AI
# Deploys:
#   1. FastAPI Python Backend Web Service
#   2. React + Vite + TypeScript Frontend Static Site

services:
  # ============================================================
  # 1. FastAPI Python Backend Web Service
  # ============================================================
  - type: web
    name: fraud-shield-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      # Allowed frontend origins for CORS (e.g. your Render frontend static site URL and local dev)
      - key: CORS_ORIGINS
        sync: false
      # MongoDB Atlas connection string (mongodb+srv://<user>:<password>@cluster.mongodb.net/?retryWrites=true&w=majority)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: fraud_shield_ai
      # Google Gemini AI API Key
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # ============================================================
  # 2. React + Vite + TypeScript Frontend Static Site
  # ============================================================
  - type: web
    name: fraud-shield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router SPA catch-all rewrite for client-side navigation
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Remote backend URL (e.g. https://fraud-shield-backend.onrender.com/api)
      - key: VITE_API_BASE_URL
        sync: false
      # Firebase Authentication credentials
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
